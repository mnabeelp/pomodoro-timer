<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <div id="titlebar">
            <div class="title">🍅 Pomodoro Timer</div>
            <div class="window-controls">
                <button id="minimize-btn" title="Minimize">
                    <i class="fas fa-window-minimize"></i>
                </button>
                <button id="close-btn" title="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <div id="timer-container">
            <div id="timer-display">25:00</div>
            <div id="timer-status">Work Session</div>
            <div id="timer-controls">
                <button id="start-btn" class="control-btn">
                    <i class="fas fa-play"></i> Start
                </button>
                <button id="pause-btn" class="control-btn" disabled>
                    <i class="fas fa-pause"></i> Pause
                </button>
                <button id="reset-btn" class="control-btn">
                    <i class="fas fa-redo"></i> Reset
                </button>
            </div>
            <div id="session-info">
                <div id="session-count">Session: 1</div>
                <div id="next-session">Next: 5 min break</div>
            </div>
        </div>

        <div id="customization">
            <div class="section-header">
                <i class="fas fa-cog"></i> Settings
            </div>

            <div class="setting-group">
                <label for="work-duration">Work Duration (minutes):</label>
                <input type="number" id="work-duration" min="1" max="60" value="25">
            </div>

            <div class="setting-group">
                <label for="break-duration">Break Duration (minutes):</label>
                <input type="number" id="break-duration" min="1" max="30" value="5">
            </div>

            <div class="setting-group">
                <label for="theme-select">Theme:</label>
                <select id="theme-select">
                    <option value="default">Default</option>
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                    <option value="green">Green</option>
                    <option value="blue">Blue</option>
                </select>
            </div>

            <div class="setting-group">
                <label>
                    <input type="checkbox" id="always-on-top" checked>
                    Always on top
                </label>
            </div>

            <div class="setting-group">
                <label>
                    <input type="checkbox" id="enable-notifications" checked>
                    Enable notifications
                </label>
            </div>

            <button id="apply-settings" class="apply-btn">
                <i class="fas fa-check"></i> Apply Settings
            </button>
        </div>

        <div id="drag-handle">
            <i class="fas fa-arrows-alt"></i> Drag to move
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
